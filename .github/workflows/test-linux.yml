name: Test Linux

on:
  push:
    branches:
      - '**'

  pull_request:

  schedule:
    - cron: '17 5 * * *'

jobs:
  # Lint is temporarily non-blocking so style findings in the new code do not hide test results.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.4

      - uses: actions/checkout@v4

      - run: go generate -run 'setup|lib/js/generate|lib/assets/generate|utils/lint'

  test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.4

      - uses: actions/checkout@v4

      # TestUseNode parses the output of use-node, so fetch it before the tests start.
      - run: go run github.com/ysmood/use-node@latest -p v20

      - run: go run ./lib/utils/ci-test -race -run=^Test . ./lib/utils ./lib/proto ./lib/cdp ./lib/defaults ./lib/devices ./lib/launcher ./lib/input

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: cdp-log-linux
          path: tmp/cdp-log
