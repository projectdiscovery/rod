<!DOCTYPE html>
<html>
  <body>
    <button data-target="#exampleModalLive" type="button">Open</button>
    <div id="exampleModalLive">
      <button type="button">Close</button>
    </div>
    <style>
      #exampleModalLive button {
        transition: transform 150ms linear;
      }
    </style>
    <script>
      document.querySelector('[data-target]').addEventListener('click', () => {
        const b = document.querySelector('#exampleModalLive button')
        b.style.transform = 'translateY(24px)'
        requestAnimationFrame(() => {
          b.style.transform = 'none'
        })
      })
      document
        .querySelector('#exampleModalLive button')
        .addEventListener('click', () => {
          document.querySelector('#exampleModalLive button').style.display =
            'none'
        })
    </script>
  </body>
</html>
