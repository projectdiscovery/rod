version: '2'
linters:
  default: all
  disable:
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - depguard
    - err113
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - gochecknoglobals
    - gochecknoinits
    - godox
    - gosec
    - intrange
    - ireturn
    - mnd
    - musttag
    - nakedret
    - nlreturn
    - nonamedreturns
    - paralleltest
    - perfsprint
    - prealloc
    - recvcheck
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 15
    funlen:
      lines: 120
    gocyclo:
      min-complexity: 15
    nestif:
      min-complexity: 6
  exclusions:
    generated: lax
    rules:
      - linters:
          - contextcheck
          - dupword
          - errorlint
          - forcetypeassert
          - funlen
          - goconst
          - lll
          - testableexamples
        path: _test.go$
      - linters:
          - dupword
          - forcetypeassert
          - gocritic
          - lll
          - revive
          - staticcheck
        path: lib/proto/
      - linters:
          - lll
        path: lib/devices/list.go
      - linters:
          - lll
        path: lib/js/helper.go
      - linters:
          - forbidigo
        path: /fixtures/
      - linters:
          - forbidigo
          - gocritic
          - noctx
        path: lib/examples/
      - linters:
          - forbidigo
          - gocritic
          - noctx
        path: examples?_test.go$
      - linters:
          - forbidigo
          - forcetypeassert
          - lll
          - noctx
        path: main.go$
      - linters:
          - lll
        path: lib/assets/
    paths:
      - third_party$
      - builtin$
      - examples$
      # Generated from the CDP schema and lib/devices/generate. Edits there are overwritten.
      - lib/proto/[^/]+\.go$
      - lib/devices/list\.go$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
